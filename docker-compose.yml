version: '3.9'


services:
  postgres:
    image: postgres:15
    container_name: chat-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ChatAppDb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # --- Azure Service Bus emulator (local stand-in for Azure Service Bus) ---
  # Only started with the "servicebus" profile, so `docker compose up -d` still starts just Postgres:
  #   ACCEPT_EULA=Y docker compose --profile servicebus up -d
  # ACCEPT_EULA=Y accepts the emulator and SQL Server Developer EULAs (dev/test use only).
  # Then run the API with:
  #   ServiceBus__Enabled=true
  #   ConnectionStrings__ServiceBus="Endpoint=sb://localhost;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;"
  # Queues are declared in servicebus-emulator/Config.json, which the emulator reads at startup.
  servicebus:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest   # multi-arch: runs natively on arm64
    container_name: chat-servicebus
    profiles: [servicebus]
    volumes:
      - ./servicebus-emulator/Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro
    ports:
      - "5672:5672"   # AMQP: what the app connects to
      - "5300:5300"   # management + health check (http://localhost:5300/health)
    environment:
      SQL_SERVER: servicebus-sql
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-LocalDev-Only-2026}
      ACCEPT_EULA: ${ACCEPT_EULA:-N}
    depends_on:
      - servicebus-sql

  # The emulator keeps its state in SQL Server. This image is x64-only: on Apple silicon,
  # Docker Desktop runs it under Rosetta (Settings > General > "Use Rosetta for x86_64/amd64
  # emulation", on by default in recent versions; SQL Server is known to crash under plain QEMU).
  # It's the image the current Microsoft Learn emulator docs use (Azure SQL Edge, the old arm64
  # option, was retired in Sept 2025).
  servicebus-sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: chat-servicebus-sql
    profiles: [servicebus]
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-LocalDev-Only-2026}
      ACCEPT_EULA: ${ACCEPT_EULA:-N}

