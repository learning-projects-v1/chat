name: Image

# Builds the API image and pushes it to GitHub Container Registry:
#   ghcr.io/learning-projects-v1/chat-api:latest      (main only)
#   ghcr.io/learning-projects-v1/chat-api:sha-<short> (every run; pin a deploy to this)
# Azure Container Apps pulls it (deploy/azure/provision.sh). Deploying is still a manual step.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # lets GITHUB_TOKEN push to ghcr.io; no personal token needed

env:
  IMAGE: ghcr.io/learning-projects-v1/chat-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64   # what Container Apps runs
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
