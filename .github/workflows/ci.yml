name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      SOLUTION: backend/ChatApp.Api/ChatBackend.sln
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore "$SOLUTION"

      - name: Build
        run: dotnet build "$SOLUTION" --configuration Release --no-restore

      - name: Unit tests
        run: dotnet test backend/tests/ChatApp.UnitTests/ChatApp.UnitTests.csproj --configuration Release --no-build --verbosity normal

      # Testcontainers starts PostgreSQL, and for the Service Bus tests the Service Bus emulator
      # plus its SQL Server, in Docker, which ubuntu-latest runners already have.
      # Set SKIP_SERVICEBUS_TESTS=true to skip the (slower) emulator tests.
      - name: Integration tests
        run: dotnet test backend/tests/ChatApp.IntegrationTests/ChatApp.IntegrationTests.csproj --configuration Release --no-build --verbosity normal
